[package]
name = "sonicity"
version = "0.0.2"
description = "A Soundboard App built using Tauri-Svelte"
authors = ["Bernard-Borg"]
license = "GNU GPLv3"
repository = "https://github.com/Bernard-Borg/Sonicity"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.4", features = [] }

[dependencies]
cpal = "0.15.3"
device_query = "1.1.3"
ffmpeg-next = "7.0.4"
rodio = "0.19.0"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
tauri = { version = "1.7.2", features = ["dialog-all", "fs-all", "path-all", "protocol-asset", "shell-open"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
